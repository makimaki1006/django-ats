{% extends "base.html" %}

{% block title %}{{ title }} - Django ATS{% endblock %}

{% block content %}
<div class="min-h-[400px] flex items-center justify-center">
    <div class="text-center">
        <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <h2 class="mt-4 text-xl font-semibold text-gray-900">{{ title }}</h2>
        <p class="mt-2 text-gray-500">{{ message }}</p>
        <a href="{% url 'dashboard' %}" class="mt-6 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
            ダッシュボードに戻る
        </a>
    </div>
</div>
{% endblock %}
