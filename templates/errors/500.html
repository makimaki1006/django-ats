{% load static %}
<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - サーバーエラー | Django ATS</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="h-full">
    <div class="min-h-full flex flex-col bg-white pt-16 pb-12">
        <main class="flex-grow flex flex-col justify-center max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex-shrink-0 flex justify-center">
                <span class="inline-flex items-center justify-center h-24 w-24 rounded-full bg-danger-100">
                    <svg class="h-12 w-12 text-danger-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </span>
            </div>
            <div class="py-8">
                <div class="text-center">
                    <p class="text-sm font-semibold text-danger-600 uppercase tracking-wide">500エラー</p>
                    <h1 class="mt-2 text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">サーバーエラー</h1>
                    <p class="mt-2 text-base text-gray-500">申し訳ございません。サーバーで問題が発生しました。</p>
                    <p class="mt-1 text-sm text-gray-400">しばらく経ってから再度お試しください。問題が続く場合は管理者にお問い合わせください。</p>
                    <div class="mt-6 flex justify-center space-x-4">
                        <a href="javascript:location.reload()" class="btn-secondary">
                            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            再読み込み
                        </a>
                        <a href="/" class="btn-primary">
                            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                            ホームに戻る
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
