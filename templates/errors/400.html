{% load static %}
<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - 不正なリクエスト | Django ATS</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="h-full">
    <div class="min-h-full flex flex-col bg-white pt-16 pb-12">
        <main class="flex-grow flex flex-col justify-center max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex-shrink-0 flex justify-center">
                <span class="inline-flex items-center justify-center h-24 w-24 rounded-full bg-warning-100">
                    <svg class="h-12 w-12 text-warning-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </span>
            </div>
            <div class="py-8">
                <div class="text-center">
                    <p class="text-sm font-semibold text-warning-600 uppercase tracking-wide">400エラー</p>
                    <h1 class="mt-2 text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">不正なリクエスト</h1>
                    <p class="mt-2 text-base text-gray-500">リクエストが正しくありません。入力内容をご確認ください。</p>
                    <div class="mt-6">
                        <a href="/" class="btn-primary">
                            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                            ホームに戻る
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
