{% load static %}
<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - ページが見つかりません | Django ATS</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="h-full">
    <div class="min-h-full flex flex-col bg-white pt-16 pb-12">
        <main class="flex-grow flex flex-col justify-center max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex-shrink-0 flex justify-center">
                <span class="inline-flex items-center justify-center h-24 w-24 rounded-full bg-primary-100">
                    <svg class="h-12 w-12 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </span>
            </div>
            <div class="py-8">
                <div class="text-center">
                    <p class="text-sm font-semibold text-primary-600 uppercase tracking-wide">404エラー</p>
                    <h1 class="mt-2 text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">ページが見つかりません</h1>
                    <p class="mt-2 text-base text-gray-500">お探しのページは存在しないか、移動した可能性があります。</p>
                    <div class="mt-6 flex justify-center space-x-4">
                        <a href="javascript:history.back()" class="btn-secondary">
                            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            前のページに戻る
                        </a>
                        <a href="/" class="btn-primary">
                            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                            ホームに戻る
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
