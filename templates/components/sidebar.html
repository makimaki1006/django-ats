{% load static %}
<!-- サイドバー -->
<div class="hidden md:flex md:flex-shrink-0">
    <div class="flex flex-col w-64">
        <div class="flex flex-col flex-grow pt-5 pb-4 overflow-y-auto bg-secondary-800">
            <!-- ロゴ -->
            <div class="flex items-center flex-shrink-0 px-4">
                <span class="text-xl font-bold text-white">Django ATS</span>
            </div>

            <!-- ナビゲーション -->
            <nav class="mt-8 flex-1 px-2 space-y-1">
                <!-- ダッシュボード -->
                <a href="{% url 'dashboard' %}"
                   class="{% if request.resolver_match.url_name == 'dashboard' %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    ダッシュボード
                </a>

                <!-- 候補者管理 -->
                <a href="{% url 'candidates:candidate_list' %}"
                   class="{% if 'candidates' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    候補者管理
                </a>

                <!-- 応募管理 -->
                <a href="{% url 'applications:application_list' %}"
                   class="{% if 'applications' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    応募管理
                </a>

                <!-- 求人管理 -->
                <a href="{% url 'jobs:job_list' %}"
                   class="{% if 'jobs' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    求人管理
                </a>

                <!-- 面接管理 -->
                <a href="{% url 'interviews:interview_list' %}"
                   class="{% if 'interviews' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    面接管理
                </a>

                <!-- ペルソナ -->
                <a href="{% url 'personas:persona_list' %}"
                   class="{% if 'personas' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    ペルソナ
                </a>

                <!-- エージェント -->
                <a href="{% url 'agents:agent_list' %}"
                   class="{% if 'agents' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    エージェント
                </a>

                <!-- セパレータ -->
                <div class="pt-4 mt-4 border-t border-secondary-700">
                    <!-- レポート -->
                    <a href="{% url 'reports:index' %}"
                       class="{% if 'reports' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                        <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                        レポート
                    </a>
                </div>

                <!-- 管理者メニュー -->
                {% if user.role == 'system_admin' or user.role == 'client_admin' %}
                <div class="pt-4 mt-4 border-t border-secondary-700">
                    <span class="px-3 text-xs font-semibold text-secondary-400 uppercase tracking-wider">管理</span>

                    <!-- ユーザー管理 -->
                    <a href="{% url 'accounts:user_list' %}"
                       class="{% if 'users' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %} mt-2">
                        <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        ユーザー管理
                    </a>

                    <!-- 設定 -->
                    <a href="{% url 'settings:index' %}"
                       class="{% if 'settings' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                        <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        設定
                    </a>

                    {% if user.role == 'system_admin' %}
                    <!-- テナント管理 -->
                    <a href="{% url 'tenants:tenant_list' %}"
                       class="{% if 'tenants' in request.path %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                        <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        テナント管理
                    </a>
                    {% endif %}
                </div>
                {% endif %}
            </nav>
        </div>
    </div>
</div>

<!-- モバイルサイドバー -->
<div x-data="{ open: false }" class="md:hidden">
    <!-- オーバーレイ -->
    <div x-show="open" x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-600 bg-opacity-75 z-40"
         @click="open = false"></div>

    <!-- サイドバー -->
    <div x-show="open" x-transition:enter="transition ease-in-out duration-300 transform"
         x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in-out duration-300 transform"
         x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full"
         class="fixed inset-y-0 left-0 flex flex-col w-64 bg-secondary-800 z-50">
        <!-- 閉じるボタン -->
        <div class="absolute top-0 right-0 -mr-12 pt-2">
            <button @click="open = false" type="button"
                    class="ml-1 flex items-center justify-center h-10 w-10 rounded-full focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white">
                <span class="sr-only">Close sidebar</span>
                <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <!-- サイドバーの中身（デスクトップと同じ） -->
        <!-- 省略: 上記と同じナビゲーション -->
    </div>
</div>
