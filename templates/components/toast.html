{#
  Toast通知コンポーネント

  このコンポーネントはbase.htmlに1度だけ含めてください。
  JavaScriptのshowToast関数を使ってトーストを表示できます。

  使用方法（JavaScript）:
  showToast('保存しました', 'success');
  showToast('エラーが発生しました', 'error');
  showToast('確認してください', 'warning');
  showToast('情報です', 'info');
#}

{# トーストコンテナ #}
<div id="toast-container"
     class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm"
     aria-live="polite"
     aria-atomic="true">
</div>

<script>
/**
 * トースト通知を表示
 * @param {string} message - 表示するメッセージ
 * @param {string} type - 通知タイプ: 'success', 'error', 'warning', 'info'
 * @param {number} duration - 表示時間（ミリ秒）、デフォルト: 5000
 */
function showToast(message, type = 'info', duration = 5000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const toastId = 'toast-' + Date.now();
    toast.id = toastId;
    toast.className = 'transform translate-x-full transition-all duration-300 ease-out';

    // タイプ別のスタイルとアイコン
    const styles = {
        success: {
            bg: 'bg-success-50 border-success-200',
            text: 'text-success-800',
            icon: '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />',
            iconColor: 'text-success-400'
        },
        error: {
            bg: 'bg-danger-50 border-danger-200',
            text: 'text-danger-800',
            icon: '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />',
            iconColor: 'text-danger-400'
        },
        warning: {
            bg: 'bg-warning-50 border-warning-200',
            text: 'text-warning-800',
            icon: '<path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />',
            iconColor: 'text-warning-400'
        },
        info: {
            bg: 'bg-blue-50 border-blue-200',
            text: 'text-blue-800',
            icon: '<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />',
            iconColor: 'text-blue-400'
        }
    };

    const style = styles[type] || styles.info;

    toast.innerHTML = `
        <div class="flex items-start p-4 rounded-lg shadow-lg border ${style.bg}">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 ${style.iconColor}" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    ${style.icon}
                </svg>
            </div>
            <div class="ml-3 flex-1">
                <p class="text-sm font-medium ${style.text}">${escapeHtml(message)}</p>
            </div>
            <div class="ml-4 flex-shrink-0">
                <button type="button"
                        onclick="closeToast('${toastId}')"
                        class="inline-flex rounded-md p-1.5 ${style.text} hover:bg-white/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                        aria-label="閉じる">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>
    `;

    container.appendChild(toast);

    // スライドインアニメーション
    requestAnimationFrame(() => {
        toast.classList.remove('translate-x-full');
        toast.classList.add('translate-x-0');
    });

    // 自動非表示
    if (duration > 0) {
        setTimeout(() => closeToast(toastId), duration);
    }
}

/**
 * トーストを閉じる
 * @param {string} toastId - トーストのID
 */
function closeToast(toastId) {
    const toast = document.getElementById(toastId);
    if (!toast) return;

    toast.classList.remove('translate-x-0');
    toast.classList.add('translate-x-full');

    setTimeout(() => toast.remove(), 300);
}

/**
 * HTMLエスケープ
 */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// htmxイベントでトースト表示
document.body.addEventListener('htmx:afterRequest', function(evt) {
    // カスタムヘッダーからトーストメッセージを取得
    const message = evt.detail.xhr.getResponseHeader('X-Toast-Message');
    const type = evt.detail.xhr.getResponseHeader('X-Toast-Type') || 'success';

    if (message) {
        showToast(decodeURIComponent(message), type);
    }
});

// htmxエラー時の自動トースト
document.body.addEventListener('htmx:responseError', function(evt) {
    const status = evt.detail.xhr.status;
    let message = 'エラーが発生しました';

    switch(status) {
        case 400: message = '入力内容に問題があります'; break;
        case 403: message = 'アクセス権限がありません'; break;
        case 404: message = 'ページが見つかりません'; break;
        case 500: message = 'サーバーエラーが発生しました'; break;
    }

    showToast(message, 'error');
});

// オフライン検出
window.addEventListener('offline', () => {
    showToast('インターネット接続が切断されました', 'warning', 0);
});

window.addEventListener('online', () => {
    showToast('インターネット接続が復旧しました', 'success');
});
</script>
