{% extends "base.html" %}
{% load static %}

{% block title %}パスワードリセット - Django ATS{% endblock %}

{% block auth_content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
        <img class="h-12 w-auto" src="{% static 'images/logo.svg' %}" alt="Django ATS">
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">
        パスワードリセット
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
        登録したメールアドレスを入力してください。<br>
        パスワードリセット用のリンクを送信します。
    </p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
        <form class="space-y-6" action="{% url 'account_reset_password' %}" method="POST">
            {% csrf_token %}

            <div>
                <label for="id_email" class="block text-sm font-medium text-gray-700">
                    メールアドレス
                </label>
                <div class="mt-1">
                    <input id="id_email" name="email" type="email" autocomplete="email" required
                           class="block w-full appearance-none rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-blue-500 sm:text-sm"
                           placeholder="your@email.com">
                </div>
                {% if form.email.errors %}
                <p class="mt-2 text-sm text-red-600">{{ form.email.errors.0 }}</p>
                {% endif %}
            </div>

            <div>
                <button type="submit"
                        class="flex w-full justify-center rounded-md border border-transparent bg-blue-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    リセットリンクを送信
                </button>
            </div>

            <div class="text-center">
                <a href="{% url 'account_login' %}" class="text-sm font-medium text-blue-600 hover:text-blue-500">
                    ログインに戻る
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
