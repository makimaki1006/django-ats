{% extends "base.html" %}
{% load static %}

{% block title %}パスワードリセットメール送信完了 - Django ATS{% endblock %}

{% block auth_content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
        <img class="h-12 w-auto" src="{% static 'images/logo.svg' %}" alt="Django ATS">
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">
        メールを送信しました
    </h2>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
        <div class="rounded-md bg-green-50 p-4 mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-green-700">
                        パスワードリセット用のリンクを送信しました。
                        メールをご確認ください。
                    </p>
                </div>
            </div>
        </div>

        <p class="text-sm text-gray-600 mb-4">
            数分経ってもメールが届かない場合は、迷惑メールフォルダをご確認ください。
        </p>

        <div class="text-center">
            <a href="{% url 'account_login' %}" class="text-sm font-medium text-blue-600 hover:text-blue-500">
                ログインに戻る
            </a>
        </div>
    </div>
</div>
{% endblock %}
