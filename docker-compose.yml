# Django ATS - Docker Compose Configuration
# Development and Production environments

version: '3.9'

services:
  # ==============================================================================
  # Web Application
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_ats_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/django_ats
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - REDIS_URL=redis://redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - django_ats_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: django_ats_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=django_ats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - django_ats_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Redis Cache / Celery Broker
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: django_ats_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - django_ats_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Celery Worker
  # ==============================================================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_ats_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/django_ats
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - django_ats_network

  # ==============================================================================
  # Celery Beat (Scheduler)
  # ==============================================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_ats_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/django_ats
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - django_ats_network

  # ==============================================================================
  # Nginx Reverse Proxy (Optional - for production)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: django_ats_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - django_ats_network
    profiles:
      - production

# ==============================================================================
# Networks
# ==============================================================================
networks:
  django_ats_network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
