# Django ATS CI/CD Pipeline
# テスト、リント、カバレッジを含む継続的インテグレーション

name: Django ATS CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Linting Job
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 isort black

      - name: Run Ruff
        run: ruff check .
        continue-on-error: true

      - name: Run isort check
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Run black check
        run: black --check --diff .
        continue-on-error: true

  # ============================================================
  # Unit Tests Job
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_ats_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-html pytest-asyncio

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_ats_test
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py migrate --noinput

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_ats_test
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          pytest tests/ \
            --ignore=tests/test_e2e.py \
            --cov=apps \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=95 \
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ============================================================
  # E2E Tests Job
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_ats_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-playwright pytest-asyncio

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_ats_e2e
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py migrate --noinput

      - name: Run E2E tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_ats_e2e
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_ALLOW_ASYNC_UNSAFE: true
        run: |
          pytest tests/test_e2e.py -v --tb=short

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================================
  # Security Scan Job
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Run Bandit security scan
        run: bandit -r apps/ -ll -ii
        continue-on-error: true

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

  # ============================================================
  # Build Status Summary
  # ============================================================
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, security]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "All tests passed!"
            exit 0
          else
            echo "Some tests failed"
            exit 1
          fi
